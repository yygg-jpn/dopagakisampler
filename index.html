:root{font-family:Arial,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#080808;background:white}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;padding:18px 19px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{text-align:center;font-weight:1000;font-size:clamp(24px,7vw,36px);letter-spacing:-1.8px;line-height:1.04}.title small{font-size:15px;letter-spacing:0}.icon{background:white;border:0;font-size:29px;width:44px;height:44px}.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:28px 0}.pad{aspect-ratio:1;border:5px solid #050505;border-radius:50%;background:#35f038;color:black;font-size:clamp(40px,13vw,72px);font-weight:1000;touch-action:none;user-select:none;position:relative;box-shadow:none}.pad.active{background:#baff70;transform:scale(.96)}.pad.loop:after{content:'↻';position:absolute;right:12%;top:9%;font-size:19px}.pad.empty{background:#d8ffd8}.bpm{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px}.bpm input{flex:1;min-width:0;accent-color:#111}.actions{display:flex;justify-content:space-around;margin:28px 0 8px}.actions button{background:white;border:0;font-size:31px;display:flex;align-items:center;flex-direction:column;gap:4px}.actions span{font-size:12px;font-weight:800}.actions .recording{color:#e22}.credit{text-align:center;font-weight:700;margin-top:24px;font-size:13px}.hint{text-align:center;font-size:12px;color:#555;min-height:18px}.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.overlay.show{display:flex}.panel{background:white;border:3px solid black;border-radius:15px;width:min(100%,460px);max-height:90dvh;overflow:auto;padding:18px}.panel h2{margin:0 0 12px}.panel label{display:block;font-weight:700;margin:13px 0 5px}.panel input[type=text],.panel input[type=number]{width:100%;padding:10px;border:2px solid black;border-radius:7px}.panel input[type=range]{width:100%;accent-color:#32ee35}.btn{padding:11px 14px;border:2px solid black;border-radius:8px;background:#35f038;font-weight:800;margin:5px 4px 5px 0}.btn.secondary{background:white}.btn.danger{background:#ffdddd}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{font-size:12px;color:#555;line-height:1.5}.status{font-weight:700;min-height:20px}audio{width:100%}#libraryItems button{display:block;width:100%;text-align:left}.tiny{font-size:12px}.bass{border:3px solid #080808;border-radius:14px;padding:12px;margin:14px 0 4px}.basshead{display:flex;align-items:center;justify-content:space-between;font-weight:900;margin-bottom:10px}.bassbuttons{display:flex;gap:8px}.bassbuttons button{flex:1;min-width:0;background:#35f038;border:2px solid black;border-radius:9px;padding:13px 4px;font-weight:900}.bassbuttons button.off{background:white}.bassbuttons button.running{background:#111;color:#35f038}.bassbuttons button.recording{background:#ffdddd}.bassstatus{font-size:12px;color:#444;margin-top:8px;min-height:16px}.pads{margin-bottom:16px}

/* Recording feedback and child-friendly guidance */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#111;color:#fff;border:2px solid #35f038;border-radius:16px;padding:12px 18px;z-index:30;max-width:min(90vw,420px);width:max-content;text-align:center;font-size:15px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 4px 18px #0004}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.error{border-color:#f33}.record-display{display:none;margin:12px 0;padding:14px;border:3px solid #e22;border-radius:13px;background:#fff4f4;text-align:center}.record-display.show{display:block}.record-title{font-weight:1000;color:#d11;font-size:21px}.record-dot{display:inline-block;width:15px;height:15px;background:#e22;border-radius:50%;margin-right:8px;animation:recpulse .8s infinite alternate}.record-clock{font-size:29px;font-weight:1000;font-variant-numeric:tabular-nums}.record-meter{display:flex;justify-content:center;align-items:center;gap:4px;height:40px}.record-meter i{width:6px;min-height:4px;height:6px;border-radius:4px;background:#e22;transition:height .09s}.record-display .btn{min-width:75%;font-size:18px}.pad.just-recorded{animation:padflash .45s 2}.bass.recording-now{border-color:#e22;animation:recborder .8s infinite alternate}.bassstatus.live{color:#d11;font-weight:900}.guide{background:#efffee;border:2px solid #111;border-radius:10px;padding:9px;margin-top:12px;font-size:13px;font-weight:700;text-align:center}@keyframes recpulse{from{opacity:1;transform:scale(1)}to{opacity:.25;transform:scale(.7)}}@keyframes padflash{50%{background:#fff}}@keyframes recborder{to{border-color:#ffaaaa}}

/* Compact mobile layout: keep primary controls in the first viewport. */
.app{padding:8px 12px 10px;max-width:480px}.top{min-height:39px}.title{font-size:clamp(19px,5.2vw,27px);line-height:1}.title small{font-size:11px}.icon{width:34px;height:34px;font-size:23px}.bpm{gap:8px;font-size:15px;min-height:29px}.pads{gap:clamp(6px,2vw,10px);margin:9px auto 7px;max-width:min(100%,calc((100dvh - 295px)*1.12));}.pad{border-width:3px;font-size:clamp(30px,10vw,56px)}.guide{margin:5px 0;padding:4px;font-size:11px;border-width:1px}.bass{padding:7px 9px;margin:6px 0 3px;border-width:2px;border-radius:10px}.basshead{margin-bottom:4px;font-size:14px}.bassbuttons button{padding:7px 3px;font-size:13px}.bassstatus{margin-top:3px;min-height:13px;font-size:10px}.actions{margin:7px 0 2px}.actions button{font-size:23px;gap:1px}.actions span{font-size:10px}.hint{font-size:10px;min-height:0}.credit{margin-top:4px;font-size:10px}.panel{max-height:88dvh}.mic-welcome{position:fixed;inset:0;background:#0009;z-index:40;display:none;align-items:center;justify-content:center;padding:20px}.mic-welcome.show{display:flex}.mic-welcome-inner{background:white;border:3px solid black;border-radius:18px;padding:24px 17px;width:min(100%,360px);text-align:center}.mic-welcome h2{font-size:23px;margin:0 0 12px}.mic-welcome p{font-size:15px;line-height:1.5}.mic-welcome button{width:100%;min-height:56px;font-size:19px}.mic-welcome .later{background:white;font-size:14px;min-height:42px}.mic-error-action{display:block;margin-top:8px}
@media(max-height:700px){.app{padding-top:3px}.title{font-size:19px}.pads{max-width:min(100%,calc((100dvh - 255px)*1.12));gap:5px;margin:5px auto}.guide{display:none}.bassstatus{display:none}.credit{margin-top:2px}}
.title{font-size:clamp(14px,4.4vw,23px);letter-spacing:-.8px;white-space:nowrap;line-height:1.2}.title small{font-size:10px}.top .icon{width:30px;height:32px;font-size:23px;flex-shrink:0}.app{padding:10px 13px 16px}.set-label{text-align:center;font-size:13px;font-weight:800;background:#f0f0f0;border-radius:6px;padding:5px;margin:5px 0 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pads{gap:8px;margin:12px 0 9px}.pad{border-width:3px;font-size:clamp(31px,11vw,58px)}.pad.loop{background:#111;color:#39ff14}.pad.loop:after{content:'ループ中';font-size:10px;right:3%;top:8%;color:#39ff14}.guide{margin-top:6px;padding:6px}.bass{margin:8px 0;padding:8px}.basshead{margin-bottom:6px}.bassbuttons button{padding:9px 3px;font-size:13px}.actions{margin:10px 0 4px;gap:4px}.actions button{flex:1;font-size:23px;gap:1px}.actions span{font-size:11px}.quick-import{text-align:center}.quick-import button{margin:3px 0;padding:7px 14px;font-size:13px}.credit{margin-top:9px}.loop-stop{display:block;width:100%;background:#111;color:#39ff14;border:2px solid #111;border-radius:8px;font-weight:900;padding:9px;margin:6px 0}.loop-stop[hidden]{display:none}

/* v1.7: feedback for every actionable control */
button{position:relative;-webkit-tap-highlight-color:transparent;transition:transform .13s ease,filter .16s ease,box-shadow .16s ease;transform-origin:center;touch-action:manipulation}
button:not(:disabled):active,button.feedback-down:not(:disabled){transform:scale(.94);filter:brightness(1.13)}
button:disabled{opacity:.52;cursor:not-allowed}
button.feedback-flash:not(:disabled){animation:control-flash .27s ease-out}
@keyframes control-flash{0%{box-shadow:0 0 0 0 #39ff14aa;filter:brightness(1.45)}45%{box-shadow:0 0 0 5px #39ff1480;filter:brightness(1.22)}100%{box-shadow:0 0 0 0 #39ff1400;filter:brightness(1)}}
.pad{isolation:isolate;transition:transform .12s ease,background .17s ease,box-shadow .17s ease}
.pad.feedback-flash:not(.loop){animation:pad-tap-flash .24s ease-out}
@keyframes pad-tap-flash{0%{background:#fff;box-shadow:0 0 0 0 #39ff14,0 0 18px 7px #39ff14}100%{box-shadow:0 0 0 0 transparent}}
.pad.loop{animation:loop-glow 1.6s ease-in-out infinite}
.pad.loop.feedback-flash{animation:loop-glow 1.6s ease-in-out infinite,pad-loop-tap .24s ease-out}
@keyframes loop-glow{0%,100%{box-shadow:0 0 0 1px #39ff1455}50%{box-shadow:0 0 0 5px #39ff14bb,0 0 14px #39ff1488}}
@keyframes pad-loop-tap{50%{filter:brightness(1.7)}}
#recMix.recording,#bassRec.recording,#recordStopBtn:not(:disabled),#bigStop:not(:disabled){animation:record-glow 1s ease-in-out infinite alternate}
@keyframes record-glow{from{box-shadow:0 0 0 0 #e22a}to{box-shadow:0 0 0 4px #e225,0 0 13px #e225}}
#bassPlay.running{animation:loop-glow 1.6s ease-in-out infinite}
input[type=range]{cursor:pointer;transition:filter .15s ease}
input[type=range]:active,input[type=range].feedback-down{filter:drop-shadow(0 0 5px #39ff14) brightness(1.12)}
@media(prefers-reduced-motion:reduce){button,.pad,input[type=range]{transition:none!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
 .top-spacer{width:30px;flex-shrink:0}.set-label{display:block;width:100%;border:0;cursor:pointer;color:#111}.pads{width:90%;margin-left:auto;margin-right:auto}.pad{font-size:clamp(27px,9vw,52px)}
 .pad .hand-number{display:block;width:57%;height:65%;object-fit:contain;pointer-events:none}.pad.loop .hand-number{filter:brightness(0) saturate(100%) invert(82%) sepia(78%) saturate(1681%) hue-rotate(55deg)}

.app{background:rgba(175,232,255,.35);min-height:100dvh}
.top{min-height:72px;justify-content:center;position:relative}
.top .title{width:min(82%,380px);height:auto;line-height:0;display:flex;justify-content:center}
.brand-logo{display:block;width:100%;height:auto;max-height:95px;object-fit:contain}
.top .icon{position:absolute;right:0;top:50%;transform:translateY(-50%);background:#fff;border:2px solid #111;border-radius:50%}
.set-label{white-space:normal;overflow:visible;text-overflow:clip;background:#d6ff43;border:2px solid #111;border-radius:12px;font-size:clamp(10px,2.75vw,13px);line-height:1.3;padding:7px 3px;margin:3px 0 8px;box-shadow:2px 3px 0 #111}
.pad,.pad.empty{display:flex;align-items:center;justify-content:center;background:#c4ff28;border:3px solid #080808;box-shadow:inset 0 2px 9px #ffffff99,3px 4px 0 #0003;overflow:visible}
.pad .hand-number{width:76%;height:76%;object-fit:contain;object-position:center;position:relative;left:0;top:0;filter:drop-shadow(0 2px 1px #1115)}
.pad.loop{background:#151515;box-shadow:0 0 0 3px #aaff00,0 0 14px 4px #aaff00;animation:loop-glow 1.6s ease-in-out infinite}
.pad.loop:before{content:'';position:absolute;inset:-8px;border:4px dashed #aaff00;border-radius:50%;animation:dopa-spin 2s linear infinite;pointer-events:none}
.pad.loop:after{content:'ぐるぐる中！';position:absolute;top:auto;bottom:-11px;right:-6px;font-size:9px;color:#111;background:#c4ff28;border:1px solid #111;border-radius:8px;padding:2px;white-space:nowrap;z-index:2}
.pad.loop .hand-number{filter:drop-shadow(0 0 4px #aaff00)}
.pad.just-recorded{animation:dopa-caught .35s ease-in-out 3}
@keyframes dopa-spin{to{transform:rotate(360deg)}}
@keyframes dopa-caught{50%{box-shadow:0 0 0 8px #fff,0 0 26px 15px #aaff00;filter:brightness(1.4)}}
.guide,.bass,.bpm,.actions,.quick-import{background:#d9f6ffcc;border-radius:12px;padding:6px}
.bass,.guide{border:2px solid #111}.actions button,.quick-import button{border-radius:9px}
@media(max-height:700px){.top{min-height:48px}.brand-logo{max-height:62px}.pads{margin:5px auto;max-width:min(90%,calc((100dvh - 320px)*1.2))}}
