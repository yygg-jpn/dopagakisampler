<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ドパガキサンプラーvol. 1</title><style>
:root{font-family:Arial,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#080808;background:white}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;padding:18px 19px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{text-align:center;font-weight:1000;font-size:clamp(24px,7vw,36px);letter-spacing:-1.8px;line-height:1.04}.title small{font-size:15px;letter-spacing:0}.icon{background:white;border:0;font-size:29px;width:44px;height:44px}.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:28px 0}.pad{aspect-ratio:1;border:5px solid #050505;border-radius:50%;background:#35f038;color:black;font-size:clamp(40px,13vw,72px);font-weight:1000;touch-action:none;user-select:none;position:relative;box-shadow:none}.pad.active{background:#baff70;transform:scale(.96)}.pad.loop:after{content:'↻';position:absolute;right:12%;top:9%;font-size:19px}.pad.empty{background:#d8ffd8}.bpm{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px}.bpm input{flex:1;min-width:0;accent-color:#111}.actions{display:flex;justify-content:space-around;margin:28px 0 8px}.actions button{background:white;border:0;font-size:31px;display:flex;align-items:center;flex-direction:column;gap:4px}.actions span{font-size:12px;font-weight:800}.actions .recording{color:#e22}.credit{text-align:center;font-weight:700;margin-top:24px;font-size:13px}.hint{text-align:center;font-size:12px;color:#555;min-height:18px}.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.overlay.show{display:flex}.panel{background:white;border:3px solid black;border-radius:15px;width:min(100%,460px);max-height:90dvh;overflow:auto;padding:18px}.panel h2{margin:0 0 12px}.panel label{display:block;font-weight:700;margin:13px 0 5px}.panel input[type=text],.panel input[type=number]{width:100%;padding:10px;border:2px solid black;border-radius:7px}.panel input[type=range]{width:100%;accent-color:#32ee35}.btn{padding:11px 14px;border:2px solid black;border-radius:8px;background:#35f038;font-weight:800;margin:5px 4px 5px 0}.btn.secondary{background:white}.btn.danger{background:#ffdddd}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{font-size:12px;color:#555;line-height:1.5}.status{font-weight:700;min-height:20px}audio{width:100%}#libraryItems button{display:block;width:100%;text-align:left}.tiny{font-size:12px}.bass{border:3px solid #080808;border-radius:14px;padding:12px;margin:14px 0 4px}.basshead{display:flex;align-items:center;justify-content:space-between;font-weight:900;margin-bottom:10px}.bassbuttons{display:flex;gap:8px}.bassbuttons button{flex:1;min-width:0;background:#35f038;border:2px solid black;border-radius:9px;padding:13px 4px;font-weight:900}.bassbuttons button.off{background:white}.bassbuttons button.running{background:#111;color:#35f038}.bassbuttons button.recording{background:#ffdddd}.bassstatus{font-size:12px;color:#444;margin-top:8px;min-height:16px}.pads{margin-bottom:16px}
</style></head><body><main class="app"><header class="top"><button class="icon" id="menu" aria-label="セット管理">☰</button><div class="title">ドパガキ<br>サンプラー <small>vol. 1</small></div><button class="icon" id="settings" aria-label="設定">⚙</button></header><div class="bpm"><label for="bpm">BPM</label><input id="bpm" type="range" min="40" max="240" value="120"><output id="bpmValue">120</output></div><section class="pads" id="pads"></section><section class="bass"><div class="basshead"><span>BASS LOOP</span><button class="btn secondary" id="bassEdit" style="font-size:12px;margin:0;padding:5px 9px">EDIT / PITCH</button></div><div class="bassbuttons"><button id="bassRec">● REC</button><button id="bassPlay" class="off">▶ LOOP</button></div><div class="bassstatus" id="bassStatus">ベースを録音してループ再生</div></section><div class="bpm" style="display:none"><label for="bpm">BPM</label><input id="bpm" type="range" min="40" max="240" value="120"><output id="bpmValue">120</output></div><div class="actions"><button id="recMix"><b>◯</b><span>REC</span></button><button id="stopAll"><b>▷</b><span>STOP ALL</span></button><button id="share"><b>⇧</b><span>SHARE</span></button></div><div class="hint" id="hint">空のパッドをタップして録音／登録済みを長押しでループ</div><footer class="credit">© 2026 hellfire</footer></main><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div><script>
'use strict';const $=id=>document.getElementById(id),pads=Array.from({length:9},(_,i)=>({name:'音 '+(i+1),pitch:0,blob:null,buffer:null,loop:false,voices:[],timer:null}));let ctx,dest,master,bpm=120,setName='マイサンプラー',micRecorder,micChunks=[],mixRecorder,mixChunks=[],lastMix=null,recordingPad=-1,recordingStream=null,loopOrigin=0;const bass={name:'BASS',pitch:0,blob:null,buffer:null,loop:false,voices:[],timer:null};pads.push(bass);const DB='dopagaki-v2';let db;
function msg(s){$('hint').textContent=s}function open(html){$('panel').innerHTML=html;$('overlay').classList.add('show')}function close(){$('overlay').classList.remove('show')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(label,fn,cls=''){let b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.onclick=fn;return b}function audio(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();dest=ctx.createMediaStreamDestination();master.connect(ctx.destination);master.connect(dest);loopOrigin=ctx.currentTime}if(ctx.state==='suspended')ctx.resume();return ctx}
function render(){let root=$('pads');root.innerHTML='';pads.slice(0,9).forEach((p,i)=>{let b=document.createElement('button');b.className='pad '+(!p.blob?'empty ':'')+(p.loop?'loop':'');b.textContent=i+1;b.setAttribute('aria-label',`${i+1} ${p.blob?p.name:'空のパッド'}`);let hold,held=false,startX,startY;function clear(){clearTimeout(hold);b.classList.remove('active')}b.addEventListener('pointerdown',e=>{if(e.button!==0)return;startX=e.clientX;startY=e.clientY;held=false;b.classList.add('active');hold=setTimeout(()=>{held=true;clear();if(p.blob)toggleLoop(i);else edit(i)},550)});b.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-startX,e.clientY-startY)>18)clear()});b.addEventListener('pointerup',e=>{clear();if(!held){if(p.blob)play(i);else edit(i)}});b.addEventListener('pointercancel',clear);b.addEventListener('contextmenu',e=>{e.preventDefault();clear();edit(i)});root.append(b)})}
async function decode(p){if(!p.blob)return;audio();try{p.buffer=await ctx.decodeAudioData(await p.blob.arrayBuffer())}catch(e){p.buffer=null;msg('この音声形式は再生できません')}}function play(i,when){let p=pads[i];if(!p.buffer)return;audio();let src=ctx.createBufferSource();src.buffer=p.buffer;src.playbackRate.value=Math.pow(2,p.pitch/12);src.connect(master);src.start(when??ctx.currentTime);p.voices.push(src);src.onended=()=>{p.voices=p.voices.filter(v=>v!==src)};return src}function stopVoices(p){p.voices.forEach(v=>{try{v.stop()}catch{}});p.voices=[]}function loopTick(i){let p=pads[i];if(!p.loop)return;let beat=60/bpm,now=ctx.currentTime,next=loopOrigin+Math.ceil((now-loopOrigin+.012)/beat)*beat;if(next<now+.012)next+=beat;let src=play(i,next);let duration=p.buffer.duration/Math.pow(2,p.pitch/12);p.timer=setTimeout(()=>loopTick(i),Math.max(40,(next+duration-ctx.currentTime)*1000-25))}function toggleLoop(i){let p=pads[i];if(!p.buffer)return;audio();p.loop=!p.loop;if(p.loop)loopTick(i);else{clearTimeout(p.timer);stopVoices(p)}render();if(i===9)renderBass();msg(p.loop?`${p.name}：ループ ON`:`${p.name}：ループ OFF`)}function stopAll(){pads.forEach(p=>{p.loop=false;clearTimeout(p.timer);stopVoices(p)});render();renderBass();msg('再生を停止しました')}
function edit(i){let p=pads[i];open(`<div class="row"><h2>${i===9?'BASS LOOP':'PAD '+(i+1)}</h2><button class="btn secondary" id="x">閉じる</button></div><label>音の名前</label><input id="padName" type="text" maxlength="30" value="${esc(p.name)}"><label>ピッチ：<output id="pitchVal">${p.pitch>0?'+':''}${p.pitch}</output> 半音</label><input id="pitch" type="range" min="-12" max="12" step="1" value="${p.pitch}"><p class="muted">ピッチを変えると再生速度も変化します。</p><div id="recordStatus" class="status"></div><div id="padButtons"></div><p class="muted">録音時はマイクの使用を許可してください。録音した音はこの端末内に保存されます。</p>`);$('x').onclick=close;$('padName').oninput=e=>{p.name=e.target.value};$('pitch').oninput=e=>{p.pitch=Number(e.target.value);$('pitchVal').textContent=(p.pitch>0?'+':'')+p.pitch;save()};let actions=$('padButtons');actions.append(btn('● 録音開始',()=>startMic(i)));actions.append(btn('■ 録音停止',stopMic,'secondary'));if(p.blob){actions.append(btn('▶ 試聴',()=>play(i),'secondary'));actions.append(btn('音を削除',()=>{stopVoices(p);p.loop=false;clearTimeout(p.timer);p.blob=null;p.buffer=null;save();close();render();if(i===9)renderBass()},'danger'))}$('padName').addEventListener('change',()=>{save();render()})}
async function startMic(i){if(micRecorder){msg('すでに録音中です');return}try{audio();recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});let mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));micRecorder=new MediaRecorder(recordingStream,mime?{mimeType:mime}:undefined);micChunks=[];recordingPad=i;micRecorder.ondataavailable=e=>{if(e.data.size)micChunks.push(e.data)};micRecorder.onstop=async()=>{let p=pads[recordingPad];p.blob=new Blob(micChunks,{type:micRecorder.mimeType});micRecorder=null;recordingStream.getTracks().forEach(t=>t.stop());recordingStream=null;await decode(p);await save();render();renderBass();if($('recordStatus'))$('recordStatus').textContent='録音を登録しました';msg(recordingPad===9?'BASSを録音しました':`PAD ${recordingPad+1} に録音しました`)};micRecorder.start();renderBass();$('recordStatus').textContent='● 録音中… 停止を押してください'}catch(e){msg('マイクを使用できません。HTTPSとマイク許可を確認してください');if($('recordStatus'))$('recordStatus').textContent='録音できませんでした'}}function stopMic(){if(micRecorder&&micRecorder.state==='recording')micRecorder.stop()}
function startMix(){audio();if(mixRecorder){mixRecorder.stop();return}try{let mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));mixRecorder=new MediaRecorder(dest.stream,mime?{mimeType:mime}:undefined);mixChunks=[];mixRecorder.ondataavailable=e=>{if(e.data.size)mixChunks.push(e.data)};mixRecorder.onstop=()=>{lastMix=new Blob(mixChunks,{type:mixRecorder.mimeType});mixRecorder=null;$('recMix').classList.remove('recording');$('recMix').querySelector('span').textContent='REC';msg('演奏録音が完了。SHAREから書き出せます')};mixRecorder.start();$('recMix').classList.add('recording');$('recMix').querySelector('span').textContent='STOP REC';msg('演奏を録音中… RECをもう一度押すと終了')}catch(e){msg('このブラウザでは演奏録音を開始できません')}}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}async function send(blob,name){let file=new File([blob],name,{type:blob.type||'application/octet-stream'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}download(blob,name)}function safe(s){return(s||'sampler').replace(/[\\/:*?"<>|]/g,'_').slice(0,70)}function blobToData(blob){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}async function exportSet(){let data={format:'dopagaki-sampler',version:1,name:setName,bpm,pads:await Promise.all(pads.slice(0,9).map(async p=>({name:p.name,pitch:p.pitch,audio:p.blob?await blobToData(p.blob):null}))),bass:{name:bass.name,pitch:bass.pitch,audio:bass.blob?await blobToData(bass.blob):null}};return new Blob([JSON.stringify(data)],{type:'application/json'})}function dataBlob(uri){let [head,data]=uri.split(',');let mime=head.match(/data:([^;]+)/)?.[1]||'audio/webm';let raw=atob(data),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:mime})}async function importSet(file){try{let obj=JSON.parse(await file.text());if(obj.format!=='dopagaki-sampler'||!Array.isArray(obj.pads)||obj.pads.length!==9)throw Error('対応していないセット形式です');stopAll();setName=String(obj.name||'マイサンプラー').slice(0,80);bpm=Math.min(240,Math.max(40,Number(obj.bpm)||120));$('bpm').value=bpm;$('bpmValue').textContent=bpm;for(let i=0;i<9;i++){let item=obj.pads[i],p=pads[i];p.name=String(item.name||'音 '+(i+1)).slice(0,30);p.pitch=Math.min(12,Math.max(-12,Number(item.pitch)||0));p.blob=item.audio?dataBlob(item.audio):null;p.buffer=null;if(p.blob)await decode(p)}bass.loop=false;bass.pitch=Math.min(12,Math.max(-12,Number(obj.bass?.pitch)||0));bass.name=String(obj.bass?.name||'BASS').slice(0,30);bass.blob=obj.bass?.audio?dataBlob(obj.bass.audio):null;bass.buffer=null;if(bass.blob)await decode(bass);await save();render();renderBass();close();msg(`「${setName}」を読み込みました`)}catch(e){msg('読み込み失敗：'+e.message)}}
function shareMenu(){open(`<div class="row"><h2>保存・共有</h2><button class="btn secondary" id="x">閉じる</button></div><label>サンプラーの名前</label><input id="setName" type="text" maxlength="80" value="${esc(setName)}"><div id="shareActions"></div><p class="muted">演奏音源は録音後に共有できます。セットは9個の録音音声とベースを含む .dopagaki.json ファイルです。友達はこのアプリの「セット管理」から読み込めます。</p>`);$('x').onclick=close;$('setName').onchange=e=>{setName=e.target.value||'マイサンプラー';save()};let a=$('shareActions');a.append(btn('セットを送る／書き出す',async()=>{setName=$('setName').value||'マイサンプラー';await save();await send(await exportSet(),safe(setName)+'.dopagaki.json')}));a.append(btn('演奏音源を送る／書き出す',async()=>{if(!lastMix){msg('先にRECで演奏を録音してください');return}await send(lastMix,safe(setName)+(lastMix.type.includes('mp4')?'.m4a':'.webm'))},'secondary'))}
function menu(){open(`<div class="row"><h2>セット管理</h2><button class="btn secondary" id="x">閉じる</button></div><p>現在：<b>${esc(setName)}</b></p><div id="libraryItems"></div><label>友達のセットを読み込む</label><input id="import" type="file" accept=".json,.dopagaki.json,application/json"><p class="muted">読み込むと現在の9パッドとベースが置き換わります。必要なら先にSHAREで書き出してください。</p>`);$('x').onclick=close;$('import').onchange=e=>{if(e.target.files[0])importSet(e.target.files[0])};let l=$('libraryItems');l.append(btn('現在のセットを端末に保存',async()=>{await save();msg('端末内に保存しました');close()}));l.append(btn('新しい空のセット',async()=>{if(!confirm('現在のパッドを消して新規セットを作成しますか？ 必要なら先に書き出してください。'))return;stopAll();pads.forEach((p,i)=>{p.name=i===9?'BASS':'音 '+(i+1);p.pitch=0;p.blob=null;p.buffer=null});setName='マイサンプラー';await save();render();renderBass();close()},'secondary'))}
function settings(){open(`<div class="row"><h2>使い方</h2><button class="btn secondary" id="x">閉じる</button></div><p>空パッドをタップ：マイク録音。BASS RECでベースを録音し、LOOPで拍に合わせて再生</p><p>録音済みをタップ：1回再生</p><p>録音済みを長押し：ループON／OFF</p><p>パッドを右クリック（PC）：音名・ピッチ編集</p><p>スマホでは録音済みパッドの編集は下のボタンから選択できます。</p><div id="editButtons"></div><p class="muted">BPMはループ開始の拍をそろえます。音源の長さや再生速度はBPMで自動調整されません。音声は端末内に保存され、セットを共有すると録音した音も含まれます。</p>`);$('x').onclick=close;let a=$('editButtons');pads.forEach((p,i)=>a.append(btn('PAD '+(i+1),()=>edit(i),'secondary')))}
function initDb(){return new Promise(resolve=>{try{let req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('state');req.onsuccess=()=>{db=req.result;resolve()};req.onerror=()=>resolve()}catch{resolve()}})}async function save(){if(!db)return;let state={setName,bpm,pads:pads.slice(0,9).map(p=>({name:p.name,pitch:p.pitch,blob:p.blob})),bass:{name:bass.name,pitch:bass.pitch,blob:bass.blob}};return new Promise(resolve=>{let tx=db.transaction('state','readwrite');tx.objectStore('state').put(state,'current');tx.oncomplete=resolve;tx.onerror=resolve})}async function load(){if(!db)return;let state=await new Promise(resolve=>{let req=db.transaction('state').objectStore('state').get('current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)});if(!state)return;setName=state.setName||setName;bpm=state.bpm||120;$('bpm').value=bpm;$('bpmValue').textContent=bpm;for(let i=0;i<9;i++){let s=state.pads?.[i];if(s){pads[i].name=s.name;pads[i].pitch=s.pitch;pads[i].blob=s.blob;if(s.blob)await decode(pads[i])}}if(state.bass){bass.name=state.bass.name||'BASS';bass.pitch=state.bass.pitch||0;bass.blob=state.bass.blob;if(bass.blob)await decode(bass)}render();renderBass()}
function renderBass(){$('bassPlay').textContent=bass.loop?'■ STOP':'▶ LOOP';$('bassPlay').className=bass.loop?'running':(bass.blob?'':'off');$('bassRec').textContent=micRecorder&&recordingPad===9?'■ STOP REC':'● REC';$('bassRec').className=micRecorder&&recordingPad===9?'recording':'';$('bassStatus').textContent=bass.loop?'ループ再生中':bass.blob?`${bass.name} · 録音済み · ピッチ ${bass.pitch>0?'+':''}${bass.pitch}`:'ベースを録音してループ再生'}
$('bassRec').onclick=()=>{if(micRecorder){if(recordingPad===9)stopMic();else msg('パッドの録音を先に終了してください')}else{startMic(9);setTimeout(renderBass,250)}};$('bassPlay').onclick=()=>{if(!bass.buffer){msg('先にBASSを録音してください');return}toggleLoop(9)};$('bassEdit').onclick=()=>edit(9);
$('bpm').oninput=e=>{bpm=Number(e.target.value);$('bpmValue').textContent=bpm};$('bpm').onchange=()=>{audio();pads.forEach((p,i)=>{if(p.loop){clearTimeout(p.timer);stopVoices(p);loopTick(i)}});save()};$('recMix').onclick=startMix;$('stopAll').onclick=stopAll;$('share').onclick=shareMenu;$('menu').onclick=menu;$('settings').onclick=settings;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};render();renderBass();initDb().then(load);
</script></body></html>
